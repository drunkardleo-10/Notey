name: Notey
options:
  bundleIdPrefix: com.notey
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: Notey
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Notey:
    type: application
    platform: macOS
    sources:
      - path: Notey
        excludes:
          - "**/*.plist"
    dependencies:
      - package: Sparkle
    info:
      path: Notey/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        SUFeedURL: https://github.com/drunkardleo-10/notey/releases/latest/download/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notey.app
        INFOPLIST_FILE: Notey/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Notey/Notey.entitlements
      properties:
        com.apple.security.app-sandbox: false

  NoteyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NoteyTests
    dependencies:
      - target: Notey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notey.app.tests
        PRODUCT_NAME: NoteyTests
        PRODUCT_MODULE_NAME: NoteyTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notey.app/Contents/MacOS/Notey"
        BUNDLE_LOADER: "$(TEST_HOST)"
